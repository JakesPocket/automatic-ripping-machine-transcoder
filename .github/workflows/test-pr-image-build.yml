name: "PR - Test Docker Build"

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-pr-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        include:
          - variant: nvidia
            suffix: ""
          - variant: amd
            suffix: "-amd"
          - variant: intel
            suffix: "-intel"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (${{ matrix.variant }})
        uses: docker/build-push-action@v6
        with:
          push: false
          context: .
          build-args: GPU_VARIANT=${{ matrix.variant }}
          platforms: linux/amd64
          tags: arm-transcoder:pr${{ github.event.number }}${{ matrix.suffix }}
