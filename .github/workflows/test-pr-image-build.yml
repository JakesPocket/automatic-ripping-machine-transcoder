name: "PR - Test Docker Build"

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-base-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build base image
        uses: docker/build-push-action@v6
        with:
          push: false
          context: .
          file: Dockerfile
          platforms: linux/amd64
          tags: arm-transcoder-base:pr${{ github.event.number }}
          outputs: type=docker

  test-variant-builds:
    needs: test-base-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - variant: nvidia
            suffix: ""
          - variant: amd
            suffix: "-amd"
          - variant: intel
            suffix: "-intel"
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build base (for FROM reference)
        uses: docker/build-push-action@v6
        with:
          push: false
          context: .
          file: Dockerfile
          platforms: linux/amd64
          tags: uprightbass360/arm-transcoder-base:latest
          load: true
      - name: Build GPU variant (${{ matrix.variant }})
        uses: docker/build-push-action@v6
        with:
          push: false
          context: .
          file: Dockerfile.${{ matrix.variant }}
          platforms: linux/amd64
          build-args: BASE_TAG=latest
          build-contexts: uprightbass360/arm-transcoder-base:latest=docker-image://uprightbass360/arm-transcoder-base:latest
          tags: arm-transcoder:pr${{ github.event.number }}${{ matrix.suffix }}
