name: Publish Docker Image

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  DOCKERHUB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/arm-transcoder
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/automatic-ripping-machine-transcoder

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - variant: nvidia
            suffix: ""
          - variant: amd
            suffix: "-amd"
          - variant: intel
            suffix: "-intel"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Read VERSION file
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SUFFIX="${{ matrix.suffix }}"
          TAGS="${{ env.DOCKERHUB_IMAGE }}:${VERSION}${SUFFIX}"
          TAGS="${TAGS},${{ env.GHCR_IMAGE }}:${VERSION}${SUFFIX}"
          if [ -z "$SUFFIX" ]; then
            TAGS="${TAGS},${{ env.DOCKERHUB_IMAGE }}:latest"
            TAGS="${TAGS},${{ env.DOCKERHUB_IMAGE }}:${VERSION}-nvidia"
            TAGS="${TAGS},${{ env.GHCR_IMAGE }}:latest"
            TAGS="${TAGS},${{ env.GHCR_IMAGE }}:${VERSION}-nvidia"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: GPU_VARIANT=${{ matrix.variant }}
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
